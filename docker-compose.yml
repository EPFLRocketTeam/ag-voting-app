# Local dev database only — run `docker compose up -d` to get a Postgres
# matching the DATABASE_URL in .env.example. Not used in production: the
# deployed app connects to Dokploy's managed Postgres resource instead
# (its connection string is set as DATABASE_URL in Dokploy's env panel).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ag_voting
      POSTGRES_PASSWORD: ag_voting
      POSTGRES_DB: ag_voting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
