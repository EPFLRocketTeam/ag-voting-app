<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Écran — Vote AG</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png" />
  <link rel="icon" href="/assets/favicon/favicon.ico" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* Projector view: everything scales with the viewport (vh/vw), so it
       reads from the back of the room at any resolution. */
    html, body { height: 100%; overflow: hidden; }
    body.screen { display: grid; grid-template-rows: auto 1fr; font-size: 2.2vh; }
    body.screen.idle-cursor { cursor: none; }

    .s-top { display: flex; align-items: center; gap: 2vh; padding: 3vh 5vw 2vh; }
    .s-top .brand-logo { height: 6vh; }
    .s-top .brand-name b { font-size: 1.9vh; }
    .s-top .brand-name span { font-size: 1.6vh; }
    .s-join { display: flex; align-items: center; gap: 1.6vh; text-align: right; color: var(--text-muted); font-size: 1.8vh; line-height: 1.3; }
    .s-join b { display: block; color: var(--text); font-weight: 600; font-size: 2.2vh; }
    .s-join .qr-box { padding: .8vh; border-radius: 1vh; margin: 0; }

    .s-main { position: relative; padding: 2vh 5vw 5vh; min-height: 0; }
    .s-view { position: absolute; inset: 2vh 5vw 5vh; display: flex; flex-direction: column; justify-content: center; animation: s-in .6s var(--ease) both; }
    @keyframes s-in { from { opacity: 0; transform: translateY(2vh); } }

    .s-eyebrow { font-size: 2vh; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--red); display: flex; align-items: center; gap: 1.4vh; margin-bottom: 2.5vh; }
    .s-eyebrow .dot { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: var(--red); animation: blink 1.2s ease-in-out infinite; }
    .s-question { font-size: 6.2vh; font-weight: 600; line-height: 1.12; letter-spacing: -0.02em; margin: 0; max-width: 72vw; text-wrap: balance; }
    .s-question.long { font-size: 4.8vh; }
    .s-choices { display: flex; flex-wrap: wrap; gap: 1.4vh; margin-top: 4vh; }
    .s-choices span { font-size: 2.6vh; font-weight: 500; padding: 1.2vh 2.6vh; border: 1px solid var(--border-strong); border-radius: 999px; }

    .s-open-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 4vw; margin-top: 7vh; }
    .s-count { font-size: 16vh; font-weight: 600; line-height: .9; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; transition: transform .25s var(--ease); }
    .s-count.bump { transform: scale(1.06); color: #fff; }
    .s-count-label { font-size: 2.2vh; letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted); margin-top: 1.5vh; }
    .s-hint { font-size: 2vh; color: var(--text-faint); margin-top: 1vh; }

    .ring { position: relative; width: 26vh; height: 26vh; flex: none; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 7; }
    .ring .track { stroke: var(--surface-3); }
    .ring .prog { stroke: var(--text); stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
    .ring.urgent .prog { stroke: var(--red); }
    .ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .ring-label b { font-size: 7vh; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
    .ring-label span { font-size: 1.6vh; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-top: .8vh; }
    .ring.urgent .ring-label b { color: var(--red); animation: blink 1s ease-in-out infinite; }

    /* closed: big results */
    .s-closed-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6vw; align-items: center; margin-top: 5vh; }
    .screen .results.with-donut { display: contents; }
    .screen .donut { width: 38vh; height: 38vh; }
    .screen .donut circle { stroke-width: 15; }
    .screen .donut-center b { font-size: 8vh; }
    .screen .donut-center span { font-size: 1.8vh; }
    .screen .bars { gap: 2.6vh; }
    .screen .bar-label { font-size: 3.2vh; }
    .screen .bar-label .name i { width: 2vh; height: 2vh; border-radius: .5vh; }
    .screen .bar-track { height: 2.2vh; }
    .screen .bar-fill { transition-duration: 1.6s; }
    .screen .bar-row.winner .name::after { font-size: 1.4vh; padding: .6vh 1.2vh; }
    .screen .results-total { font-size: 2vh; }
    .s-closed .s-question { font-size: 4.6vh; }

    /* idle */
    .s-idle { align-items: center; text-align: center; }
    .s-idle-grid { display: grid; grid-template-columns: auto auto; gap: 8vw; align-items: center; text-align: left; }
    .s-idle h1 { font-size: 7vh; margin: 0 0 2vh; }
    .s-idle p { font-size: 2.8vh; color: var(--text-muted); margin: 0 0 1vh; }
    .s-idle .url { font-size: 3.4vh; color: var(--text); font-weight: 500; }
    .s-idle .qr-box { padding: 2vh; border-radius: 2vh; }

    .fs-btn { position: fixed; right: 2vh; bottom: 2vh; opacity: .55; }
    .fs-btn:hover { opacity: 1; }
    body.idle-cursor .fs-btn, body.is-fullscreen .fs-btn { display: none; }
  </style>
</head>
<body class="screen">
  <header class="s-top">
    <div class="brand">
      <img class="brand-logo" src="/assets/ert-rocket.svg" alt="" />
      <div class="brand-name"><b>Assemblée Générale</b><span>EPFL Rocket Team</span></div>
    </div>
    <div class="topbar-spacer"></div>
    <div id="corner-join" class="s-join hidden">
      <div><b id="corner-url"></b>Scanne pour voter</div>
      <div class="qr-box"><canvas id="corner-qr"></canvas></div>
    </div>
  </header>

  <main class="s-main">
    <section id="view-idle" class="s-view s-idle hidden">
      <div class="s-idle-grid">
        <div>
          <div class="s-eyebrow">Vote électronique</div>
          <h1>Rejoins le vote</h1>
          <p>Scanne le code avec ton téléphone<br />ou ouvre</p>
          <p class="url" id="idle-url"></p>
          <p class="faint" style="margin-top: 3vh; font-size: 2vh;">La première question apparaîtra ici.</p>
        </div>
        <div class="qr-box"><canvas id="idle-qr"></canvas></div>
      </div>
    </section>

    <section id="view-open" class="s-view hidden">
      <div class="s-eyebrow"><span class="dot"></span>Vote en cours</div>
      <h1 id="open-question" class="s-question"></h1>
      <div id="open-choices" class="s-choices"></div>
      <div class="s-open-bottom">
        <div>
          <div id="open-count" class="s-count">0</div>
          <div class="s-count-label" id="open-count-label">votes reçus</div>
          <div class="s-hint">Les résultats s'affichent à la clôture du vote.</div>
        </div>
        <div id="ring" class="ring hidden">
          <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="45"></circle><circle class="prog" id="ring-prog" cx="50" cy="50" r="45"></circle></svg>
          <div class="ring-label"><b id="ring-time">0:00</b><span id="ring-sub">restant</span></div>
        </div>
      </div>
    </section>

    <section id="view-closed" class="s-view s-closed hidden">
      <div class="s-eyebrow">Résultat du vote</div>
      <h1 id="closed-question" class="s-question"></h1>
      <div id="closed-results" class="s-closed-grid"></div>
    </section>
  </main>

  <button id="fs-btn" class="btn btn-sm fs-btn" type="button">Plein écran (F)</button>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/vendor/qrcode.min.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/screen.js"></script>
</body>
</html>
